blurb: |
  This was my second roll of film in my OM-10. I started getting my head around shutter speed and aperture as it related to motion, and was intentional about capturing the parkrun as a blur of people.

  This was also the second home developed roll, and you can see it's a little rough. That said there's a decent amount of positives, both the tree stump and the mossy branch have rendered nicely.
