blurb: |
  This was the first roll I took on my new OM-4 Ti camera, taken on a walk home from work, through St John's Wood up to Hampstead. I have come to really enjoy shooting on this camera: for the majority of shots I don't have to worry about what I'm doing RE shutter, just set it to Auto and fire. Both the OM-4 and the OM-10n (which I spent the bulk of the year shooting) have aperture priority, but the OM-10n had a few issues which meant it wouldn't always trigger correctly and I'd end up with a massively underexposed photo.

  One thing I did want to achieve with this new camera was the option to change the shutter speed, something I can now do (though entirely electronically, unlike the OM-1 I have sitting ready for some repairs). This meant I could start to actually get a feel for what the shutter speed was given the circumstances and adjust more to my own creative expression. It's also a good opportunity to start applying the "Sunny 16" approach to metering, as I really get my head around the exposure / shutter speed / ISO triangle (notably how much easier this triangle is if one of the points is fixed, i.e. film speed).

  I really like the shadow of the tree on the hospital sign, but the lack of breathing room for the sign makes the whole picture feel cramped to me. My absolute favourite has to be the Shepherd's Path photo, where patches of light shine through the trees, illuminating parts of the wall and a person walking along - this whole avenue is lined by these towering trees that leave a canopy of leaves over the road and pavement, it's cooler to walk up over the summer but can feel dark at times when it's overcast but the day this photo was taken light was beaming through the leaves.
